project_id = "entrelinhas"

[functions.access-control]
# The function verifies every bearer token with Auth and validates its session_id.
# Required when using new publishable keys and asymmetric JWT signing keys.
verify_jwt = false

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/", "http://127.0.0.1:5173/", "http://127.0.0.1:4173/Video_Translate/"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
